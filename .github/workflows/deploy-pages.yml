name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; do not cancel a run that is mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the static site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Ask GitHub where the site will live. For a project URL this yields
      # base_path "/ntd" and base_url "https://<owner>.github.io/ntd"; for a
      # custom domain it yields base_path "" and the domain. The build uses both,
      # so the same workflow serves either without a code change.
      #
      # `enablement: true` switches Pages to the GitHub Actions source if it is
      # still set to "Deploy from a branch" (which builds the README with Jekyll
      # instead of this export).
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # `build` runs validate → build:api → build:llms → next build → out/.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}

      - name: Prepare Pages files
        run: |
          touch out/.nojekyll
          # Claim the custom domain only when one is actually configured, so a
          # project-URL deployment is never hijacked by an unverified domain.
          case "${{ steps.pages.outputs.base_url }}" in
            *github.io*) rm -f out/CNAME ;;
            *) echo "${{ steps.pages.outputs.base_url }}" | sed 's#https\?://##; s#/$##' > out/CNAME ;;
          esac
          echo "base_url=${{ steps.pages.outputs.base_url }} base_path=${{ steps.pages.outputs.base_path }}"
          ls -la out | head

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
