name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  corpus:
    name: Corpus, types, lint, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate the corpus (ids, references, placeholder sources)
        run: npm run validate
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Build the static site, JSON API and llms files
        run: npm run build

  links:
    name: Source links
    runs-on: ubuntu-latest
    # External sites go down and rate-limit; this job reports but does not block.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:links
